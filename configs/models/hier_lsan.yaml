# HIER-Legal-BERT+LSAN: hierarchical encoder with label-specific attention whose label
# embeddings are randomly initialised and learned (label-aware attention without statute text).
model:
  arch: hierarchical
  encoder: legal
  pooling: lsan
  dropout: 0.1
  attention_dropout: 0.1
  segment_chunk_size: 64
  gradient_checkpointing: false
  document_transformer:
    layers: 2
    heads: 8
    dropout: 0.1
loss:
  multi_label: bce
  single_label: ce
run:
  name: hier_legal_bert_lsan
