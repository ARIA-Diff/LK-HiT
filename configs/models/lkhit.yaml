# LK-HiT: hierarchical document branch + statute-text knowledge branch + label-aware attention.
model:
  arch: lkhit
  encoder: legal              # role resolved through data.encoders (LEGAL-BERT / RoBERTa-wwm-ext)
  hierarchy: true
  label_knowledge: statute    # statute | random
  pooling: label_attention    # label_attention | mean
  dropout: 0.1
  attention_dropout: 0.1
  segment_chunk_size: 64      # paragraphs encoded per forward pass (memory only)
  gradient_checkpointing: false
  document_transformer:
    layers: 2
    heads: 8
    dropout: 0.1
  label_encoder:
    shared: true              # same encoder for facts and statutes
    freeze: false
    max_tokens: 256
    chunk_size: 32
  label_graph:
    enabled: true
    layers: 2
    cooccurrence: true        # positive PMI edges from the training split
    structure: true           # same Convention section / micro-thesaurus / Criminal Law chapter
loss:
  multi_label: asymmetric
  asymmetric:
    gamma_pos: 0.0
    gamma_neg: 2.0
    margin: 0.05
  single_label: class_balanced_ce
  class_balanced:
    beta: 0.999
run:
  name: lkhit
