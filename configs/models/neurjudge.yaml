# NeurJudge (Yue et al., 2021): separates the crime description from the circumstances.
model:
  arch: neurjudge
  embedding_dim: 200
  embedding_dropout: 0.2
  pretrained_vectors: null
  vocab:
    min_freq: 5
    max_size: 100000
  max_words: 512
  article_max_words: 200
  similarity_threshold: 0.3
  hidden_size: 128
  dropout: 0.3
loss:
  single_label: ce
run:
  name: neurjudge
