# Zero-shot Qwen2.5-7B-Instruct served with vLLM; greedy decoding, JSON list of labels.
model:
  arch: zero_shot_llm
  name: Qwen/Qwen2.5-7B-Instruct
  max_doc_tokens: 8000
  max_new_tokens: 128
  max_model_len: 12288
  dtype: bfloat16
  system_prompt: "You are a careful legal assistant. Answer only with the requested JSON."
run:
  name: qwen2.5_7b_zero_shot
