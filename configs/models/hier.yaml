# HIER-* baselines (LexGLUE hierarchical configuration): shared encoder over paragraphs,
# two-layer document transformer, mean pooling, linear classifier, BCE / CE.
model:
  arch: hierarchical
  encoder: legal
  pooling: mean
  dropout: 0.1
  segment_chunk_size: 64
  gradient_checkpointing: false
  document_transformer:
    layers: 2
    heads: 8
    dropout: 0.1
loss:
  multi_label: bce
  single_label: ce
run:
  name: hier_legal_bert
