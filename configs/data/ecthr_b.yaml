# ECtHR-B (LexGLUE): Convention articles the applicant alleged to have been violated.
data:
  task: ecthr_b
  hf_dataset: coastalcph/lex_glue
  hf_config: ecthr_b
  hf_cache_dir: data/raw/hf_cache
  language: en
  multi_label: true
  none_label: none            # explicit "no allegation" label
  segmentation: paragraph
  max_segments: 64
  max_segment_tokens: 128
  flat_max_tokens: 512
  sparse_max_tokens: 4096
  processed_dir: data/processed/ecthr_b
  cache_dir: data/processed/ecthr_b/cache
  precompute: true
  num_workers: 2
  encoders:
    legal: nlpaueb/legal-bert-base-uncased
    general: bert-base-uncased
    longformer: allenai/longformer-base-4096
    bigbird: google/bigbird-roberta-base
  knowledge:
    resources_dir: resources
  subgroups:
    length_unit: paragraphs
    length_boundaries: [20, 50]
