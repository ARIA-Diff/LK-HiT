# ECtHR-A (LexGLUE): Convention articles found to have been violated.
data:
  task: ecthr_a
  hf_dataset: coastalcph/lex_glue
  hf_config: ecthr_a
  hf_cache_dir: data/raw/hf_cache
  language: en
  multi_label: true
  none_label: none            # explicit "no violation" label appended to the 10 articles
  segmentation: paragraph     # fact paragraphs as provided by the corpus
  max_segments: 64            # N
  max_segment_tokens: 128     # T
  flat_max_tokens: 512        # truncated encoders
  sparse_max_tokens: 4096     # Longformer / BigBird window
  processed_dir: data/processed/ecthr_a
  cache_dir: data/processed/ecthr_a/cache
  precompute: true
  num_workers: 2
  encoders:
    legal: nlpaueb/legal-bert-base-uncased
    general: bert-base-uncased
    longformer: allenai/longformer-base-4096
    bigbird: google/bigbird-roberta-base
  knowledge:
    resources_dir: resources
  rationales:
    dataset: AUEB-NLP/ecthr_cases
    config: violation-prediction
    field: silver_rationales
  metadata:
    decision_years: data/raw/ecthr/test_decision_years.csv   # doc_index,itemid,judgment_date (HUDOC)
  subgroups:
    length_unit: paragraphs
    length_boundaries: [20, 50]
