# Shared optimisation protocol (Table: hyper-parameters). Chosen on the ECtHR-A dev set, fixed for all tasks.
train:
  batch_size: 4
  grad_accumulation: 4        # effective batch of 16 documents
  eval_batch_size: 8
  epochs: 20
  patience: 3                 # early stopping on dev macro-F1
  selection_metric: macro_f1
  lr_encoder: 3.0e-5          # pre-trained encoder
  lr_upper: 1.0e-4            # document transformer, GCN, attention, classifier
  weight_decay: 0.01
  warmup_ratio: 0.10
  max_grad_norm: 1.0
  betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  amp: true
  amp_dtype: float16
  log_every: 50
  target_risk: 0.10           # coverage reported at 10 % selective risk
  rationale_k: 5
  aux_loss_weight: 1.0
  calibration:
    max_iter: 50              # L-BFGS iterations for temperature scaling
  deterministic: false
run:
  root: runs
