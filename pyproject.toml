[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lkhit"
version = "1.0.0"
description = "Statute-aware hierarchical transformers for calibrated multi-label legal judgment prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
  "datasets>=2.18",
  "numpy>=1.24",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
